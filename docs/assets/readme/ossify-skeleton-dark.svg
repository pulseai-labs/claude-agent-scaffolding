<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="ossify: /ossify:start cuts Release 0 as a thin slice that runs end to end; /ossify:adopt closes what already shipped as Release 0. Bone and flesh spines grow it to an MVP; v1 ships. Every spine runs plan-spine, run-spine and close, then work-pr where the repo has a remote."><title>ossify: /ossify:start cuts Release 0 as a thin slice that runs end to end; /ossify:adopt closes what already shipped as Release 0. Bone and flesh spines grow it to an MVP; v1 ships. Every spine runs plan-spine, run-spine and close, then work-pr where the repo has a remote.</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1f3a"/><stop offset="1" stop-color="#2a1240"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9d1d9"/></marker></defs><rect width="880" height="380" rx="16" fill="url(#bg)"/><text x="40.0" y="66.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">ossify</text><text x="40.0" y="98.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#c9b6ff" text-anchor="start">skeleton first: start a new project, or adopt an existing one</text><text x="40.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">/ossify:start</text><text x="40.0" y="208.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">new project</text><text x="40.0" y="260.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">/ossify:adop