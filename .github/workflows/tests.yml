name: repository test suites

# CI entry point for the repository's deterministic test suites (SS-6 / #53).
# Runs plugin suites, Node adapter tests, the real OpenCode loader, and repo-root
# parity gates on PRs and pushes to main. One step per suite isolates failures.
#
# Tooling: ubuntu-latest ships bash, jq, node, npm, and ruby (with Psych). OpenCode
# is installed at the exact supported version before the model-free loader test.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suites:
    name: repository test suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # SHA-pinned for supply-chain hardening (#71). Update the SHA + comment together on bump.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # No step pushes/fetches with the token, so don't leave it in .git/config (#84).
          persist-credentials: false

      - name: Install OpenCode 1.18.13
        run: npm install --global opencode-ai@1.18.13

      - name: Tool versions
        run: |
          bash --version | head -1
          jq --version
          node --version
          opencode --version
          ruby --version
          ruby -e 'require "psych"; puts "psych ok"'

      - name: Configure git (fixtures git-init + commit)
        run: |
          git config --global user.email "ci@scaffolding.local"
          git config --global user.name "scaffolding CI"
          git config --global init.defaultBranch main

      - name: workspace-init suite
        run: bash workspace-init/run-tests.sh

      - name: ai-mentor suite
        run: bash ai-mentor/tests/test-frontmatter-lint.sh

      - name: scaffold-dev suite
        run: bash scaffold-dev/run-tests.sh

      - name: scaffold-onboard suite
        run: bash scaffold-onboard/run-tests.sh

      - name: architect-critic suite
        run: bash architect-critic/run-tests.sh

      - name: ossify suite
        run: bash ossify/tests/run-all.sh

      - name: claude-security-audit suite
        # Skip the wall-clock perf benchmark on shared runners (flaky vs the homelab
        # reference machine); it still runs locally / on the homelab (#71).
        env:
          CSA_SKIP_PERF: "1"
        run: bash claude-security-audit/run-tests.sh

      - name: code-judo suite
        run: bash code-judo/run-tests.sh

      - name: orca-crew suite
        run: bash orca-crew/run-tests.sh

      - name: dual-publish parity (repo-root)
        run: bash tests/test-codex-dual-publish.sh

      - name: recommendation-policy parity (repo-root)
        run: bash tests/test-recommendation-policy-parity.sh

      - name: OpenCode runtime adapter unit suite
        run: node --test tests/test-opencode-runtime-adapter.mjs

      - name: OpenCode 1.18.13 live loader integration
        run: bash tests/test-opencode-live.sh
