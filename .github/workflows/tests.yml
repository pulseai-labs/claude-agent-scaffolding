name: repository test suites

# CI entry point for the repository's deterministic test suites (SS-6 / #53).
# Runs plugin suites and repo-root parity gates on PRs and pushes to main. One step
# per suite isolates failures.
#
# Tooling: ubuntu-latest ships bash, jq, node, npm, and ruby (with Psych).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suites:
    name: repository test suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # SHA-pinned for supply-chain hardening (#71). Update the SHA + comment together on bump.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # No step pushes/fetches with the token, so don't leave it in .git/config (#84).
          persist-credentials: false
          # Two commits: a PR's merge commit and its base, for the added-fixture check (#1013).
          fetch-depth: 2

      - name: Install Claude Code 2.1.289
        run: npm install --global @anthropic-ai/claude-code@2.1.289

      - name: Tool versions
        run: |
          bash --version | head -1
          jq --version
          node --version
          ruby --version
          ruby -e 'require "psych"; puts "psych ok"'

      - name: Configure git (fixtures git-init + commit)
        run: |
          git config --global user.email "ci@scaffolding.local"
          git config --global user.name "scaffolding CI"
          git config --global init.defaultBranch main

      - name: workspace-init suite
        run: bash workspace-init/run-tests.sh

      - name: sage suite
        run: bash sage/tests/test-frontmatter-lint.sh

      - name: ossify suite
        run: bash ossify/tests/run-all.sh

      - name: added eval fixtures have results
        # A PR's checkout is its merge commit, so HEAD^1 is the base it merges into (#1013).
        if: github.event_name == 'pull_request'
        run: bash tests/check-added-fixture-results.sh HEAD^1 HEAD

      - name: added-fixture check's own tests
        run: bash tests/test-added-fixture-results.sh

      - name: membrane suite
        # Skip the wall-clock perf benchmark on shared runners (flaky vs the homelab
        # reference machine); it still runs locally / on the homelab (#71).
        env:
          CSA_SKIP_PERF: "1"
        run: bash membrane/run-tests.sh

      - name: remodel suite
        run: bash remodel/run-tests.sh

      - name: Install dagr 0.3.1 (contract v3)
        # crew's tests/test-crew-run.sh runs the real `dagr check --strict` and fails, never skips,
        # without it. Pinned to herdr-dagr's v0.3.1 linux-musl asset and its sha256 (the release's own
        # dagr-x86_64-unknown-linux-musl.sha256 file says the same). Update the URL and the digest together.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/dagr"
          mkdir -p "$dir/download"
          curl -fsSL -o "$dir/download/dagr.tar.gz" \
            https://github.com/aemrebarut/herdr-dagr/releases/download/v0.3.1/dagr-x86_64-unknown-linux-musl.tar.gz
          echo "d70cbdf4ce69218b681ca56ecfdc280380489f67c84f539eed8149ba07920188  $dir/download/dagr.tar.gz" | sha256sum -c -
          tar xzf "$dir/download/dagr.tar.gz" -C "$dir" dagr
          rm -rf "$dir/download"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/dagr" --version | grep -F "contract v3"

      - name: crew suite
        run: bash crew/run-tests.sh

      - name: merge-bar suite
        run: bash merge-bar/run-tests.sh

      - name: seat-mods suite
        run: bash seat-mods/run-tests.sh

      - name: molt suite
        run: bash molt/run-tests.sh

      - name: dual-publish parity (repo-root)
        run: bash tests/test-codex-dual-publish.sh

      - name: mod shell-reader parity (repo-root)
        run: bash tests/test-mod-shell-parity.sh

      - name: recommendation-policy parity (repo-root)
        run: bash tests/test-recommendation-policy-parity.sh

      - name: crew parity pins (repo-root)
        # crew's verbatim copy of ossify's eval aggregator, its Codex prompts,
        # and the manifest/marketplace description. A plugin suite cannot see its
        # sibling tree, so this one is repo-root.
        run: bash tests/test-crew-parity.sh

      - name: crew rename gate (repo-root)
        # The rename's clean cut (spec §4.6): no tracked path, no catalog entry and no
        # tree-wide reference to the old plugin name outside CHANGELOG history and
        # config.md's old-path stop. Repo-root because it scans every plugin's tree,
        # which crew's own runner cannot see.
        run: bash tests/test-crew-rename.sh

      - name: pulsestack rename gate (repo-root)
        # The marketplace and three plugins under their new names: no old directory, no old
        # catalog entry, no old namespace, path, marketplace key or repo URL outside the
        # survivors the gate lists with their reasons. Planted-defect controls run with it.
        run: bash tests/test-pulsestack-rename.sh

      - name: root README gate (repo-root)
        run: bash tests/test-root-readme.sh

      - name: community files gate (repo-root)
        run: bash tests/test-community-files.sh

      - name: retired-plugin gate (repo-root)
        # Each retired plugin (#948 and later): no tracked path, no catalog entry and no tree-wide
        # reference outside CHANGELOG history and the sanctioned survivors listed in the
        # script. Repo-root because it scans every plugin's tree.
        run: bash tests/test-retired-plugins.sh

      - name: merge-bar template parity (repo-root)
        # ossify's fallback PR-body template must match merge-bar's (ossify 1.13.0).
        run: bash tests/test-merge-bar-template-parity.sh

      - name: Mutation harness contract
        # tests/lib/mutate.sh: the shared mutation-test harness - one literal
        # replacement, the mutated line echoed, the suite run from the caller's
        # cwd, and the file restored from a saved copy (never from git).
        run: bash tests/test-mutate.sh

      - name: Install Bun 1.4.2
        run: npm install --global bun@1.4.2 && bun --version

      - name: baton suite
        run: bash baton/run-tests.sh

      - name: OMP bin-path module and loader (bun test)
        run: bun test omp/

      - name: OMP surface gate (repo-root)
        run: bash tests/test-omp-surface.sh
